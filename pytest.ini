[pytest]
# Async test policy, stated explicitly.
#
# tests/conftest.py claimed to "Configure pytest-asyncio to auto mode" but only
# called addinivalue_line("markers", ...), which registers a marker name and does
# not change the mode. The effective mode was therefore strict (the default) —
# which is correct here, since async tests carry explicit @pytest.mark.asyncio
# and tests/test_delegation/ uses pytest.mark.anyio. Pinning it means a future
# change to pytest-asyncio's default cannot silently alter which tests run.
asyncio_mode = strict

# Silences the pytest-asyncio 1.x unset-loop-scope deprecation warning.
asyncio_default_fixture_loop_scope = function

# No testpaths on purpose: CI runs bare `pytest` from the repo root and collects
# both tests/ (455) and cpb/tests/ (16). Setting testpaths = tests would silently
# drop the cpb suite.

markers =
    asyncio: async test driven by pytest-asyncio
    anyio: async test driven by the anyio pytest plugin
