name: Research CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Validate Research Framework
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          # Matches ci.yml. These drifted (3.11 here, 3.12 there), so the two
          # workflows were validating against different interpreters.
          python-version: '3.12'

      - name: Validate Scripts
        run: |
          echo "🔍 Validating Python syntax..."
          python -m py_compile scripts/session/init_session.py
          python -m py_compile scripts/session/log_url.py
          python -m py_compile scripts/session/status.py
          python -m py_compile scripts/session/archive_session.py
          python -m py_compile scripts/session/sync_environments.py
          echo "✅ All scripts valid"

      - name: Test Init Session (Dry Run)
        run: |
          echo "🧪 Testing init_session.py --help..."
          python scripts/session/init_session.py --help

      - name: Test Status Script
        run: |
          echo "🧪 Testing status.py..."
          python scripts/session/status.py || true  # May fail without session, that's ok

      - name: Framework Health Check
        run: |
          echo "📊 Framework Health Check"
          echo "========================="
          echo "README.md exists: $(test -f README.md && echo '✅' || echo '❌')"
          echo "SKILL.md exists: $(test -f docs/SKILL.md && echo '✅' || echo '❌')"
          echo "Scripts: $(find scripts -name '*.py' | wc -l) files"
          echo "Modules: $(ls -1d */ 2>/dev/null | wc -l) directories"
          echo "========================="
          echo "✅ ResearchGravity — Metaventions AI"

  quality-gate:
    name: Metaventions Quality Gate
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      # Every check below now exits non-zero when it fails. Previously they
      # printed "⚠️ Missing ..." and carried on, and the brand check only echoed
      # on success — so this job reported SUCCESS unconditionally and could not
      # detect the drift it exists to catch.
      - name: Check Documentation Standards
        run: |
          echo "📝 Checking documentation standards..."
          missing=0

          test -f docs/SKILL.md || { echo "❌ docs/SKILL.md missing"; exit 1; }

          for section in "Cold Start Protocol" "Source Hierarchy" "Quality Checklist"; do
            if grep -q "$section" docs/SKILL.md; then
              echo "✅ $section documented"
            else
              echo "❌ Missing $section"
              missing=1
            fi
          done

          [ "$missing" -eq 0 ] || { echo "Documentation standards not met"; exit 1; }
          echo "✅ Documentation standards verified"

      - name: Metaventions Brand Check
        run: |
          echo "🎨 Verifying Metaventions AI branding..."
          missing=0

          if grep -q "Metaventions AI" README.md; then
            echo "✅ Brand present in README"
          else
            echo "❌ Brand missing from README"
            missing=1
          fi

          if grep -q "dicoangelo@metaventionsai.com" docs/SKILL.md; then
            echo "✅ Contact info present"
          else
            echo "❌ Contact info missing from docs/SKILL.md"
            missing=1
          fi

          [ "$missing" -eq 0 ] || { echo "Brand verification failed"; exit 1; }
          echo "✅ Brand verification complete"
