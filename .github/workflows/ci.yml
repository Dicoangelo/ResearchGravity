name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install ruff
        run: |
          python -m pip install --upgrade pip
          pip install ruff
      # Real bugs — syntax errors and undefined names. These block.
      # Keeping this separate from the style sweep means the blocking gate stays
      # trustworthy instead of being switched off wholesale the first time a
      # style rule gets noisy.
      - name: Ruff check (errors — blocking)
        run: ruff check --select E9,F63,F7,F82 .

      # Style and everything else — advisory, as before.
      - name: Ruff check (style — advisory)
        run: ruff check .
        continue-on-error: true

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]
    steps:
      - uses: actions/checkout@v6
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Test
        run: pytest --ignore=tests/test_mcp.py

      # The MCP pipeline (Protocol -> Router -> Capture -> UCW Bridge -> DB) is a
      # standalone runner, deliberately skipped under pytest. It was invoked
      # nowhere — not here, not in scripts, not in setup.sh — so 26 integration
      # tests never ran anywhere. It exits non-zero on failure, so it gates here.
      - name: MCP pipeline integration tests
        run: python3 tests/test_mcp_raw.py
